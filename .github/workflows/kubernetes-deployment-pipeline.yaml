name: Build Gatus and Leantime

on:
  push:
    branches:
      - dev1
    paths:
      - "eks/**"
      - "gatus/**"
      - ".github/workflows/kubernetes-deployment-pipeline.yaml"


env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "my-repo"
  TOKEN: ${{ secrets.TOKEN }} 
  # GATUS_URL: "http://a64879e791eb24ef29155149a3edafc3-1799427462.us-east-1.elb.amazonaws.com"
  # LEANTIME_URL: "http://ad3b9398c793b494788a6e3e2ebd8cc2-1257053076.us-east-1.elb.amazonaws.com"


jobs:
  deploy_gatus:
    name: Deploy Gatus App
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update Configuration
        run: |
          sed -i "s|<github-token>|$TOKEN|g" gatus/config.yaml
          sed -i "s|<leantime-url>|$LEANTIME_URL|g" gatus/config.yaml
          sed -i "s|<gatus-url>|$GATUS_URL|g" gatus/config.yaml
          echo "Cofiguration updated."
          cat gatus/config.yaml

      - name: Get Short Commit Hash
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./gatus
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_FULL_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV


  deploy_eks:
    name: Deploy EKS
    runs-on: ubuntu-latest
    needs: deploy_gatus
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Get Short Commit Hash
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash

    
      - name: Build 
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i s"|<image-gatus>|$ECR_REGISTRY/&ECR_REPOSITORY:IMAGE_TAG|g" eks/gatus-deployment-dev1.yaml
          sed -i s"|<image-leantime>|leantime/leantime:latest|g" eks/leantime-deployment-dev1.yaml
          cat eks/gatus-deployment-dev1.yaml
          cat eks/leantime-deployment-dev1.yaml


      - name: Update Kubeconfig file
        run: |
          aws eks update-kubeconfig --region us-east-1 --name eks-cluster-02

      - name: Delete Kubeconfig file
        run: |
          kubectl delete -f eks/gatus-deployment-dev1.yaml
          kubectl delete -f eks/gatus-service.yaml
          kubectl delete -f eks/leantime-deployment-dev1.yaml
          kubectl delete -f eks/leantime-service.yaml

      - name: Apply Kubeconfig file
        run: |
          kubectl apply -f eks/gatus-deployment-dev1.yaml
          kubectl apply -f eks/gatus-service.yaml
          kubectl apply -f eks/leantime-deployment-dev1.yaml
          kubectl apply -f eks/leantime-service.yaml
          echo "Kubernetes applied."

      - name: Get LoadBalancer URLs
        run: |
          GATUS_URL=$(kubectl get svc gatus-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          LEANTIME_URL=$(kubectl get svc leantime-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "GATUS_URL=http://$GATUS_URL" >> $GITHUB_ENV
          echo "LEANTIME_URL=http://$LEANTIME_URL" >> $GITHUB_ENV

      