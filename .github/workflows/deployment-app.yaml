name: Deploy gatus and leantime apps

on:
  push:
    branches:
      - dev2
    paths:
      - "gatus/**" 
      - "eks/**"
      - ".github/workflows/deployment-app.yaml"

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "my-repo"
  TOKEN: ${{ secrets.TOKEN }}

jobs:
  deploy_gatus:
    name: Deploy Gatus App
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update Kubeconfig file
        run: |
          aws eks update-kubeconfig --region us-east-1 --name eks-cluster-01

      - name: Get LoadBalancer URLs
        run: |
          GATUS_URL=$(kubectl get svc gatus-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          LEANTIME_URL=$(kubectl get svc leantime-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "GATUS_URL=http://$GATUS_URL" >> $GITHUB_ENV
          echo "LEANTIME_URL=http://$LEANTIME_URL" >> $GITHUB_ENV
      
      - name: Replace placeholders in config.yaml
        run: |
          sed -i "s|<leantime-url>|$LEANTIME_URL|g" gatus/config/config.yaml
          sed -i "s|<gatus-url>|$GATUS_URL|g" gatus/config/config.yaml
          cat gatus/config/config.yaml 

      - name: Update Configuration
        run: |
          sed -i "s|<github-token>|$TOKEN|g" gatus/config/config.yaml
          sed -i "s|<leantime-url>|$LEANTIME_URL|g" gatus/config/config.yaml
          sed -i "s|<gatus-url>|$GATUS_URL|g" gatus/config/config.yaml
          echo "Cofiguration updated."
          cat gatus/config/config.yaml

      - name: Get Short Commit Hash
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./gatus
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_FULL_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV


  
  deploy_eks:
    name: Deploy Leantime App
    runs-on: ubuntu-latest
    needs: deploy_gatus
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Short Commit Hash
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash


      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i "s|<image-gatus>|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" eks/gatus-deployment.yaml
          sed -i "s|<image-leantime>|leantime/leantime:latest|g" eks/leantime-deployment.yaml
          echo "IMAGE_FULL_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV 
          cat eks/gatus-deployment.yaml
          cat eks/leantime-deployment.yaml

      - name: Replace image in task definition
        run: |
          sed -i "s|<image-gatus>|$IMAGE_FULL_URI|g" eks/gatus-deployment.yaml
   

      - name: kubefile leantime service
        run: |
          kubectl delete -f eks/leantime-service.yaml
          kubectl apply -f eks/leantime-deployment.yaml

      - name: kubefile leantime deployment
        run: |
          kubectl delete -f eks/leantime-deployment.yaml
          kubectl apply -f eks/leantime-deployment.yaml

      - name: kubefile gatus service
        run: |
          kubectl delete -f eks/gatus-service.yaml
          kubectl apply -f eks/gatus-service.yaml

      - name: kubefile gatus deployment
        run: |
          kubectl delete -f eks/gatus-deployment.yaml
          kubectl apply -f eks/gatus-deployment.yaml


        